name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  TF_VERSION: "1.15.2"
  # Folder path matched with your repository structure
  WORKING_DIR: "./terraform_resualble_module_01_08_27/environements"

jobs:

  # ==========================================
  # Terraform Validation and Plan
  # ==========================================
  terraform-plan:

    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout Repository
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Azure Login
      # ----------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ----------------------------------------
      # Setup Terraform
      # ----------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------
      # Terraform Format
      # ----------------------------------------
      - name: Terraform Format
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform fmt -recursive

      # ----------------------------------------
      # Terraform Init
      # ----------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init

      # ----------------------------------------
      # Terraform Validate
      # ----------------------------------------
      - name: Terraform Validate
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform validate

      # ----------------------------------------
      # Terraform Plan
      # ----------------------------------------
      - name: Terraform Plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan

      # ----------------------------------------
      # Upload Terraform Plan
      # ----------------------------------------
      - name: Upload Terraform Plan
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIR }}/tfplan


  # ==========================================
  # Terraform Apply
  # ==========================================
  terraform-apply:

    name: Terraform Apply
    needs: terraform-plan

    # Apply only after merge/push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # ----------------------------------------
      # Checkout Repository
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Azure Login
      # ----------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      # ----------------------------------------
      # Setup Terraform
      # ----------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ----------------------------------------
      # Terraform Init
      # ----------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform init

      # ----------------------------------------
      # Download Terraform Plan Artifact
      # ----------------------------------------
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.WORKING_DIR }}

      # ----------------------------------------
      # Terraform Apply
      # ----------------------------------------
      - name: Terraform Apply
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform apply -auto-approve tfplan
